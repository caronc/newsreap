# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#               NewsReap Configuration File
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# Created by `nr --init`.  At the very least you'll want to fill in your
# server details below (host, port, username and password).
#
# NewsReap looks for its configuration in these locations (in order; .yml
# works too, ie: config.yml):
#    ~/.config/newsreap/config.yaml
#    ~/newsreap/config.yaml
#    ~/.newsreap/config.yaml
#    /etc/newsreap/config.yaml
#    /etc/newsreap.yaml
#
# You can also point to any file you like with: nr --config /path/to/file
#
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   Global Configuration
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
global:
   # Where NewsReap keeps things.  Left alone, each kind goes where your
   # system expects it (these are the Linux ones):
   #  - this file and your filters:      the directory this file is in
   #                                      (%{config_dir})
   #  - what can't be fetched again (the databases, the posts kept and
   #    your PGP keys):                   ~/.local/share/newsreap
   #                                      (%{data_dir})
   #  - what can be fetched again (the cached headers, downloads in
   #    progress):                        ~/.cache/newsreap (%{cache_dir})
   #
   # Set base_dir to keep everything in one directory instead (the caches
   # go in its cache/ directory), or move each kind on its own:
__BASE_DIR__
   # data_dir: '~/.local/share/newsreap'
   # cache_dir: '~/.cache/newsreap'

   # Where content is downloaded to (and prepared) before it's processed
   work_dir: '%{cache_dir}/tmp'

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   NNTP Server Definitions
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# You can define as many servers as you like.  The first one is your main
# server; any others are used as backups for content the main one is
# missing.
servers:
  - host: my.server.here
    # 563 is the usual port for secure (TLS) connections; 119 is the usual
    # one for unsecured connections
    port: 563

    # Your login
    username: myusername
    password: mypassword

    # Use a secure (TLS) connection; match this to the port above
    secure: True

    # Check the server's certificate is signed by a trusted authority and
    # is for the host above.  For a server with a self signed certificate,
    # point ca_certs at a copy of it instead of turning this off.
    verify_cert: True
    # ca_certs: /path/to/server.crt

    # Ask the server to compress what it sends us (if it can).  This is
    # safe to leave on; we fall back to no compression on our own.
    compress: True

    # Older servers needed a group to be selected before you could fetch
    # articles from it.  Most don't anymore.
    join_group: False

    # Fetch articles using BODY (just the content) instead of ARTICLE
    # (the headers too).  The headers are handy, so this is usually off.
    use_body: False

    # Use HEAD (instead of STAT) when checking on an article
    use_head: True

    # Set to False to keep this entry but not use it
    enabled: True

    # How many connections your provider lets you make at once (check your
    # account).  Leave one or two spare for your newsreader.  Without it,
    # connections: under processing: is used.
    # connections: 10

    # How many times a failed download is retried before giving up, and
    # when a connection is treated as dead:
    #  - stall_timeout: seconds without receiving anything at all
    #  - min_rate: bytes per second the transfer averages over slow_window
    #    seconds (set either to 0 to turn the check off)
    retries: 3
    stall_timeout: 60
    min_rate: 1024
    slow_window: 120

# A backup server; remove the leading '#' from each line to use it
#  - host: my.backup.server.here
#    port: 563
#    username: myusername
#    password: mypassword
#    secure: True
#    verify_cert: True
#    compress: True
#    join_group: False
#    use_body: False
#    use_head: True
#    enabled: True
#    # Backups often allow fewer connections than your main server
#    connections: 4

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   Processing (Before and After Downloading)
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
processing:
   # How many connections are made to a server at once, so more work can
   # happen at once (each server can set its own with connections:).
   # More helps until your bandwidth is full; fetching headers rarely gets
   # faster past about 8.  Don't go higher than your provider allows.
   connections: 4

   # How many headers are processed at a time when indexing a group.
   # Between 25000 and 75000 works well; go higher with lots of CPU power
   # and lower without.
   header_batch_size: 25000

   # A directory in memory (a ramdisk) speeds up indexing a lot.  On Linux
   # you can make one like so:
   #    sudo mkdir -p /var/newsreap/swap
   #    sudo mount -t tmpfs -o size=4G tmpfs /var/newsreap/swap
   #
   # Then remove the '#' below and point it there.
   # ramdisk: /var/newsreap/swap

   # A collection that is missing parts is treated as finished (as
   # complete as it is going to get) once every group it was found in has
   # been scanned this many seconds past its last article (1800 is half
   # an hour).  Not scanning for a while never makes a collection look
   # incomplete.
   collection_settle_time: 1800

   # Something posted this many days apart from a collection with the same
   # name and poster is treated as a repost (a collection of its own).
   # Set it to 0 to never split them.
   repost_days: 3

   # Usenet is big; the article headers cached for each group can be
   # removed once they are indexed and older than this many days.  The
   # collections keep everything needed to make their NZB files.  0 keeps
   # every header (needed by 'nr search --raw').  Archive a group ('nr
   # update archive') before its headers are removed.
   raw_retention: 0

   # 'nr update archive' fetches the articles no bigger than this and keeps
   # what they say, so a group full of discussion can be searched offline
   # ('nr search --posts').  Files they hold are only noted, never kept.
   archive_max_size: 64KB

   # What 'nr update' does for every group without being asked: keep what
   # the small articles say (as --content does) and read the NZB files
   # posted (as --nzb does).  Keeping content means fetching every small
   # article, which suits discussion groups more than busy binary ones, so
   # it is usually better set for each group ('nr group watch <group>
   # --content') than here.  Both are off unless set to yes.
   # content: yes
   # nzb: yes

   # Keep the PGP keys found in the posts 'nr update --content' fetches, and
   # which posts each key signed or was encrypted for, so you can see who
   # posted what and search by key ('nr pgp', 'nr search --key').  Only
   # public details are kept.  With your own secret key imported ('nr pgp
   # import'), the posts encrypted for you are decrypted too (this needs
   # gpg).  Off unless set to yes.
   # pgp: yes

   # Where gpg keeps the secret keys posts are decrypted with; set it to
   # ~/.gnupg to use the keys (and gpg-agent) you already have.
   # pgp_home: '%{data_dir}/pgp'

   # A post that couldn't be decrypted (ie: its passphrase wasn't known
   # yet) is tried again by the next 'nr update', this many times.  Answers
   # that won't change (the server no longer has it, or it isn't for any of
   # your keys) aren't tried again.  0 leaves it to 'nr pgp decrypt'.
   # pgp_retries: 1

   # Rules that drop spam before it is stored, and score and tag the rest
   # (see 'nr filter --help').  Every .yaml (or .yml) file of the filters
   # directory next to this file is read, in the order of their names (so
   # 00-spam.yaml comes before 50-scores.yml); rules saved from the
   # command line go into its saved.yaml.  Its example.yaml.template shows
   # every setting a rule can have.  Give another directory (or a single
   # file) here; one that isn't there (or a file in it that can't be read)
   # is reported, and the rest carry on.
   # filters: '%{config_dir}/filters'

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   Downloading ('nr get')
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# What an NZB file lists is downloaded into a staging directory of its own
# (in %{cache_dir}/downloads), put back together, repaired with its par2
# files and extracted into a directory named after it.  Running it again
# carries on where it stopped.  Each of these can be changed for one run
# on the command line too (ie: --no-cleanup).
downloads:
   # Where finished downloads go; your system's Downloads directory (ie:
   # ~/Downloads) when not set
   # download_dir: '~/Downloads'

   # Repair damaged files with their par2 files (only the recovery volumes
   # a repair needs are downloaded)
   # repair: yes

   # Extract the archives (rar, 7z, zip), trying --password and then the
   # passwords the NZB file holds
   # extract: yes

   # Remove what was downloaded once it is all put together and placed
   # (it is always kept when something couldn't be opened)
   # cleanup: yes

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   Posting to your NNTP Server
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
posting:
    # Stamped on everything you post
    poster: 'Newsreap <reaper@newsreap.io>'

    # The subject used for each article posted
    subject: '{{description}} (%Y-%m-%d)" - "{{filename}}" yEnc ({{index}}/{{count}})'

    # Content larger than this is split into several articles.  Most
    # providers don't allow more than 760KB, so only change this if you're
    # sure.
    max_article_size: 760KB

    # Archives (rar, 7z, zip) larger than this are split into several
    # files.  Use a size (ie: 25MB) or 'auto' to work it out from the
    # content being posted.
    max_archive_size: auto

    # Protect the archives with a password; it is written into the NZB
    # file so it isn't lost.  Leave it out for no password, use 'auto' to
    # make up a new one for each post (letters, numbers and symbols), or
    # give the password itself.  'nr post --password' and
    # '--no-password' override this.
#    password: auto

    # How long the passwords made up for you are (0 to 127); 0 makes none,
    # the same as leaving the password out.  It doesn't change a password
    # you give yourself.
#    password_length: 24

# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
#   Database Configuration
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# Where indexed groups and articles are kept.  This is an SQLAlchemy URL so
# most databases are supported; a larger database server (PostgreSQL,
# MySQL) is faster than SQLite for big groups.
database:
   engine: 'sqlite:///%{data_dir}/newsreap.db'
#   engine: 'postgresql+psycopg2://user:pass@localhost/newsreap'
#   engine: 'mysql+mysqldb://user:pass@hostname/newsreap'

   # Where the collections found are indexed (and searched).  By default
   # it is an SQLite file in the data directory; give it a database of its
   # own on a server if you index a lot:
   #  - PostgreSQL needs the pg_trgm and unaccent extensions (the owner of
   #    the database can add them; newsreap does it for you)
   #  - MySQL needs version 8 or newer (for its ngram full text search)
   # Posts and downloads always keep their own small SQLite file, so they
   # can pick up where they left off.
#   index_engine: 'postgresql+psycopg2://user:pass@localhost/newsreap_index'
#   index_engine: 'mysql+pymysql://user:pass@hostname/newsreap_index'
