[global]
alwayscopy = True

[gh]
use_discover = False

[tox]
envlist =
    clean
    validate
    lint
    qa

minversion = 4.0
requires = virtualenv>=20.0.0
isolated_build = True

[testenv]
skip_install = false
usedevelop = true
changedir = {toxinidir}
allowlist_externals = *
ensurepip = true
uv_seed = true
setenv =
    COVERAGE_RCFILE = {toxinidir}/pyproject.toml

[testenv:lint]
description = Check for lint violations and code style issues (read-only)
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . {posargs}

[testenv:format]
description = Auto-fix lint violations
skip_install = true
deps = ruff==0.15.8
commands =
    ruff check . --fix {posargs}

[testenv:shell]
description = Obtain a shell with the newsreap library in it's path
extras = dev
commands =
    pip install --no-cache-dir -e ".[dev]"
    python {posargs}

[testenv:nr]
description = Run the NewsReap CLI (nr); options go after --
              (ie: tox -e nr -- --init)
commands =
    nr {posargs}

[testenv:cli]
description = Sanity-check NewsReap CLI invocation
commands =
    nr --help

[testenv:checkdone]
description = Lint + full test run to ensure PR readiness
extras = dev
commands =
    pip install --no-cache-dir -e ".[dev]"
    ruff check .
    pytest tests --cov=newsreap --cov-report= {posargs}
    coverage report

[testenv:qa]
description = Full tests + code coverage
extras = dev
commands =
    pip install --no-cache-dir -e ".[dev]"
    coverage erase
    pytest tests --cov=newsreap --cov-report= {posargs}
    coverage report -m
    coverage xml -o coverage.xml

[testenv:servers]
description = Index tests on PostgreSQL and/or MySQL too; point
              NEWSREAP_TEST_POSTGRESQL and/or NEWSREAP_TEST_MYSQL at an
              empty database (its URL); everything in it is removed
extras = dev,postgresql,mysql
passenv =
    NEWSREAP_TEST_POSTGRESQL
    NEWSREAP_TEST_MYSQL
commands =
    pip install --no-cache-dir -e ".[dev,postgresql,mysql]"
    pytest tests/NNTPIndexer_Test.py tests/NNTPArchiver_Test.py \
        tests/NNTPPurger_Test.py tests/NNTPSearch_Test.py \
        tests/NNTPArticleRanks_Test.py tests/NNTPGrouping_Test.py {posargs}

[testenv:test]
description = Run simplified tests without coverage
extras = dev
commands =
    pip install --no-cache-dir -e ".[dev]"
    pytest --tb=short -q {posargs}

[testenv:clean]
description = Remove build artifacts and cache files
skip_install = true
allowlist_externals =
    find
    rm
commands =
    find . -type f -name "*.pyc" -delete
    find . -type f -name "*.pyo" -delete
    find . -type f -name "*.orig" -delete
    rm -rf .cache .ruff_cache .coverage-reports .coverage coverage.xml dist build newsreap.egg-info .pytest_cache
    find . -type d -name "__pycache__" -delete

[testenv:build]
description = Build sdist and wheel
deps = build
commands =
    python -m build

[testenv:build-sdist]
deps = build
commands = python -m build --sdist

[testenv:build-wheel]
deps = build
commands = python -m build --wheel

[testenv:validate]
description = Validate pyproject.toml against PEP 621/508
skip_install = true
deps =
    validate-pyproject
    packaging
commands =
    validate-pyproject pyproject.toml

[testenv:twine-check]
description = Run twine check on dist artifacts
skip_install = true
deps = twine
commands =
    python -m twine check dist/*.whl dist/*.tar.gz

[testenv:release]
description = Validate and build all artifacts
skip_install = true
deps =
    validate-pyproject
    packaging
    build
    twine
commands =
    tox -e clean
    tox -e validate
    tox -e build
    tox -e twine-check
